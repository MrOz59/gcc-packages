name: Verify

# Installs each pinned compiler from its published repository on a current
# Arch and compiles with it. Runs after every publish, and weekly against the
# newest release of every pin: the packages link against Arch's libisl, libmpc
# and friends, and when one of those changes soname a release stops
# installing. This catches that here, before it shows up as a broken CUDA step
# in a consumer's CI. The fix is a "Build and publish" run for that pin with
# the next rebuild number.
on:
  workflow_call:
    inputs:
      pin:
        type: string
        default: ""
      tag:
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      pin:
        description: Pin to verify (e.g. gcc14); empty verifies every pin.
        default: ""
  schedule:
    - cron: "37 5 * * 1"

permissions: {}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Find the releases to verify
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PIN: ${{ inputs.pin }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ -n ${TAG} ]]; then
            matrix="$(jq -cn --arg pin "${PIN}" --arg tag "${TAG}" '[{pin: $pin, tag: $tag}]')"
          else
            matrix="$(bash scripts/plan.sh verify "${PIN}")"
          fi
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"
          jq . <<< "${matrix}"

  verify:
    name: Install and compile ${{ matrix.tag }}
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install from the release and compile
        env:
          PIN: ${{ matrix.pin }}
          TAG: ${{ matrix.tag }}
        run: |
          bash scripts/verify-repo.sh "pins/${PIN}.env" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
