name: Build and publish

# One build per pin. A push builds every pin in pins/ that has no release yet
# and does nothing for the rest, so the multi-hour GCC bootstrap only runs
# when a pin changes or a rebuild is asked for by hand.
on:
  push:
    branches: [main]
    paths:
      - pins/**
      - scripts/**
      - .github/workflows/build.yml
  workflow_dispatch:
    inputs:
      pin:
        description: >-
          Pin to build, as named in pins/ without .env (e.g. gcc14). Empty
          builds every pin that has no release yet.
        default: ""
      rebuild:
        description: >-
          Rebuild number for that pin. 0 builds the pinned version; 1, 2, ...
          republish the same recipe against newer Arch libraries, e.g. after a
          libisl soname bump makes the current release uninstallable.
        default: "0"

permissions: {}

concurrency:
  group: build-and-publish
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Find the pins to build
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PIN: ${{ inputs.pin }}
          REBUILD: ${{ inputs.rebuild || '0' }}
        run: |
          set -euo pipefail
          matrix="$(bash scripts/plan.sh build "${PIN}" "${REBUILD}")"
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"
          jq . <<< "${matrix}"

  build:
    name: Build ${{ matrix.pin }}
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-24.04
    # The bootstrap-lto build takes hours on a hosted runner; 6 h is the cap.
    timeout-minutes: 355
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # A GCC bootstrap plus the full git mirror makepkg clones needs far more
      # than the runner's free space; the preinstalled SDKs are never used here.
      # This is also why the build runs under `docker run` rather than as a
      # container job: a container job can't clear the host.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo docker image prune --all --force > /dev/null
          df -h /

      # fakeroot walks every possible file descriptor, and Docker's default
      # limit of a million makes makepkg's package step crawl.
      - name: Build in an Arch container
        env:
          PIN: ${{ matrix.pin }}
        run: |
          mkdir -p "${RUNNER_TEMP}/dist"
          docker run --rm \
            --ulimit nofile=1024:524288 \
            -v "${GITHUB_WORKSPACE}:/repo:ro" \
            -v "${RUNNER_TEMP}/dist:/dist" \
            archlinux:latest \
            bash /repo/scripts/build-packages.sh "/repo/pins/${PIN}.env" /dist

      - name: Upload the repository
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: repo-${{ matrix.pin }}
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error
          # Everything in it is already compressed.
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish ${{ matrix.tag }}
    needs: [plan, build]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Download the repository
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: repo-${{ matrix.pin }}
          path: dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          PIN: ${{ matrix.pin }}
          TAG: ${{ matrix.tag }}
          TITLE: ${{ matrix.title }}
        run: |
          set -euo pipefail
          . "pins/${PIN}.env"
          server="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          {
            echo "GCC ${PKGVER}-${PKGREL} for Arch Linux, built from the AUR \`${AUR_PACKAGE}\` recipe at"
            echo "[\`${AUR_REVISION:0:12}\`](https://aur.archlinux.org/cgit/aur.git/commit/?h=${AUR_PACKAGE}&id=${AUR_REVISION})."
            echo
            echo "Add to \`/etc/pacman.conf\`:"
            echo
            echo '```ini'
            echo "[${REPO_NAME}]"
            echo "SigLevel = Optional TrustAll"
            echo "Server = ${server}"
            echo '```'
            echo
            echo "then \`pacman -Sy ${AUR_PACKAGE}\`. The compiler is \`/usr/bin/g++-${PKGVER%%.*}\`; the system \`gcc\` is untouched."
            echo
            echo "The exact GCC source and recipe these packages were built from are attached."
            echo
            echo "<details><summary>SHA256SUMS</summary>"
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
            echo
            echo "</details>"
          } > notes.md

          gh release create "${TAG}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "${TITLE}" \
            --notes-file notes.md

          # pacman asks for exactly the names in the database; if GitHub
          # renamed any asset on upload, the repository is broken.
          diff <(ls dist | sort) \
            <(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name' | sort)

  verify:
    name: Verify ${{ matrix.tag }}
    needs: [plan, publish]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: read
    with:
      pin: ${{ matrix.pin }}
      tag: ${{ matrix.tag }}
